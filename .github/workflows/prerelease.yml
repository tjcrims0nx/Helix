name: Pre-Release Beta

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional prerelease tag (for example v0.3.1-beta.1)'
        required: false
        type: string
      name:
        description: 'Optional release title'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'pre-release/**'
      - 'deploy/get-cerberus-beta.ps1'
      - '.github/workflows/prerelease.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-beta:
    name: Build Windows beta installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve prerelease tag
        id: release
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($inputTag)) {
            $stamp = Get-Date -AsUTC -Format "yyyyMMdd-HHmmss"
            $tag = "v${{ github.run_number }}-beta.$stamp"
          } else {
            $tag = $inputTag.Trim()
          }

          $inputName = "${{ inputs.name }}"
          if ([string]::IsNullOrWhiteSpace($inputName)) {
            $releaseName = "Cerberus Desktop $tag Beta"
          } else {
            $releaseName = $inputName.Trim()
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$releaseName" >> $env:GITHUB_OUTPUT

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo / Tauri target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (NSIS only for beta)
        run: npx tauri build --bundles nsis

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $nsis = Get-ChildItem "$bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            $dst = Join-Path $nsis.Directory "Cerberus-Beta-Setup.exe"
            if ($nsis.FullName -ne $dst) { Move-Item -Force $nsis.FullName $dst }
            Write-Host "NSIS: $dst"
          } else {
            Write-Host "::warning::No NSIS exe produced"
          }
          Get-ChildItem "$bundle" -Recurse -Include *.exe | ForEach-Object { Write-Host $_.FullName }

      - name: Compute SHA-256 hashes
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $files = Get-ChildItem $bundle -Recurse -Include *.exe
          $files | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Tee-Object -Append SHA256SUMS.txt
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-beta-installers
          path: |
            src-tauri/target/release/bundle/nsis/Cerberus-Beta-Setup.exe
            SHA256SUMS.txt

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Beta channel build. Download installers directly from GitHub Releases.
          files: |
            src-tauri/target/release/bundle/nsis/Cerberus-Beta-Setup.exe
            SHA256SUMS.txt
