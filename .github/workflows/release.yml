name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Validate stable release tag
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}".Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Stable releases must use tags like v0.4.0. Got '$tag'. Use the prerelease workflow for beta tags."
          }

          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoText = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargoText, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $expected = $tag.TrimStart('v')

          if ($packageVersion -ne $expected -or $tauriVersion -ne $expected -or $cargoVersion -ne $expected) {
            throw "Tag/version mismatch. tag=$tag package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo / Tauri target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build bundled skills-server
        # tauri.conf.json bundles ../skills-server/{dist,node_modules}/**/* as
        # resources. Both are gitignored, so on a clean CI checkout they don't
        # exist and `tauri build` fails with "glob pattern ... didn't match any
        # files". Install the sub-package deps and compile it to dist/ first.
        run: npm ci && npm run build
        working-directory: skills-server

      - name: Build Tauri app (NSIS + MSI)
        run: npx tauri build

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $nsis = Get-ChildItem "$bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            $dst = Join-Path $nsis.Directory "HELIX-Setup.exe"
            if ($nsis.FullName -ne $dst) { Move-Item -Force $nsis.FullName $dst }
            Write-Host "NSIS: $dst"
          } else {
            Write-Host "::warning::No NSIS exe produced"
          }
          Get-ChildItem "$bundle" -Recurse -Include *.exe,*.msi | ForEach-Object { Write-Host $_.FullName }

      - name: Compute SHA-256 hashes
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $files  = Get-ChildItem $bundle -Recurse -Include *.exe,*.msi
          $files | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Tee-Object -Append SHA256SUMS.txt
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/HELIX-Setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: HELIX Desktop ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            src-tauri/target/release/bundle/nsis/HELIX-Setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
